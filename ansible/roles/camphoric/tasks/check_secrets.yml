---
# defaults/main.yml ships placeholder secrets so a development VM provisions without a vault.
# Anywhere else they must be overridden (see the role's README): a known SECRET_KEY lets
# anyone forge session cookies and decrypt the stored SMTP passwords.
- name: Refuse placeholder secrets outside development
  when: camphoric_environment != 'development'
  vars:
    camphoric_secret_vars:
      - camphoric_postgresql_password
      - camphoric_django_secret_key
      - camphoric_paypal_client_id
      - camphoric_paypal_secret
    camphoric_placeholder_secrets: >-
      {{ camphoric_secret_vars
         | zip(query('vars', *camphoric_secret_vars) | map('string'))
         | selectattr('1', 'match', 'this-should-be')
         | map('first') | list
         + (['camphoric_django_superuser_password']
            if camphoric_django_superuser_password | string == 'admin' else []) }}
  ansible.builtin.assert:
    that: camphoric_placeholder_secrets | length == 0
    fail_msg: >-
      camphoric_environment is '{{ camphoric_environment }}' but these still hold their
      placeholder defaults: {{ camphoric_placeholder_secrets | join(', ') }}.
      Set real values in the inventory or a vault-encrypted host_vars file; see the
      camphoric role's README.
    quiet: true
