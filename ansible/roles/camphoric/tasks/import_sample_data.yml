---
- name: Import sample data
  become: true
  become_user: "{{ camphoric_user }}"
  environment:
    DJANGO_SUPERUSER_USERNAME: "{{ camphoric_django_superuser_username }}"
    DJANGO_SUPERUSER_PASSWORD: "{{ camphoric_django_superuser_password }}"
    DJANGO_SUPERUSER_EMAIL: "{{ camphoric_django_superuser_email }}"
    SECRET_KEY: "{{ camphoric_django_secret_key }}"
    CAMPHORIC_LTA_GMAIL_NAME: "{{ camphoric_email_name }}"
    CAMPHORIC_LTA_GMAIL_USERNAME: "{{ camphoric_email_host_user }}"
    CAMPHORIC_LTA_GMAIL_PASSWORD: "{{ camphoric_email_host_password }}"
    PAYPAL_BASE_URL: "{{ camphoric_paypal_base_url }}"
    PAYPAL_CLIENT_ID: "{{ camphoric_paypal_client_id }}"
    PAYPAL_SECRET: "{{ camphoric_paypal_secret }}"
    CAMPHORIC_URL: "{{ camphoric_url }}:8000"
  block:
    # Part of a reset: the "never" tag keeps it out of untagged and install runs,
    # so it only runs when a reset tag is requested explicitly.
    - name: Reset data
      tags: [never, camphoric_reset, camphoric_data_reset]
      become: yes
      become_user: "{{ camphoric_user }}"
      ansible.builtin.shell:
        cmd: pipenv run python manage.py flush --noinput
        chdir: "{{camphoric_folder}}/server"

    # A data reset skips "Setup Django", so migrate here too: loading into a
    # schema behind the code fails partway, leaving only the first event.
    - name: Run Django migrations
      tags: [camphoric_install, camphoric_reset, camphoric_data_reset]
      become: yes
      become_user: "{{ camphoric_user }}"
      ansible.builtin.shell:
        cmd: pipenv run python manage.py migrate
        chdir: "{{camphoric_folder}}/server"

    # Fails harmlessly when the superuser already exists (no reset ran).
    - name: Create Django superuser
      tags: [camphoric_install, camphoric_reset, camphoric_data_reset]
      ignore_errors: yes
      become: yes
      become_user: "{{ camphoric_user }}"
      ansible.builtin.shell:
        cmd: pipenv run python manage.py createsuperuser --noinput
        chdir: "{{camphoric_folder}}/server"

    # npm ci installs the events that aren't workspaces from GitHub Packages
    # (data/.npmrc), which needs a token even for public packages: from
    # camphoric_npm_token, or one the VM user's ~/.npmrc already has. Without
    # either, stop here with how to give one, rather than at npm ci's 401.
    - name: Check for a GitHub Packages token in ~/.npmrc
      when: camphoric_environment == 'development' and camphoric_npm_token | length == 0
      tags: [npm, camphoric_install, camphoric_reset, camphoric_data_reset]
      ansible.builtin.shell:
        cmd: "grep -qs '^//npm.pkg.github.com/:_authToken=.' ~{{ camphoric_user }}/.npmrc"
      register: camphoric_npmrc_token
      changed_when: false
      failed_when: false

    - name: Stop without a GitHub Packages token
      when: >-
        camphoric_environment == 'development' and camphoric_npm_token | length == 0
        and camphoric_npmrc_token.rc != 0
      tags: [npm, camphoric_install, camphoric_reset, camphoric_data_reset]
      ansible.builtin.fail:
        msg: >-
          data/ installs events from GitHub Packages, which needs a token with read:packages.
          Provision with CAMPHORIC_NPM_AUTH_TOKEN=$(gh auth token) vagrant provision, or set
          camphoric_vault_npm_token in your vault (see VM_DEV_SETUP.md).

    - name: Give npm the GitHub Packages token
      when: camphoric_environment == 'development' and camphoric_npm_token | length > 0
      tags: [npm, camphoric_install, camphoric_reset, camphoric_data_reset]
      no_log: true
      ansible.builtin.lineinfile:
        path: "~{{ camphoric_user }}/.npmrc"
        regexp: '^//npm\.pkg\.github\.com/:_authToken='
        line: "//npm.pkg.github.com/:_authToken={{ camphoric_npm_token }}"
        create: true
        mode: '0600'

    - name: Install npm modules
      when: camphoric_environment == 'development'
      tags: [npm, camphoric_install, camphoric_reset, camphoric_data_reset]
      ansible.builtin.shell:
        chdir: "{{camphoric_folder}}/data"
        cmd: "npm ci"

    # Sample data only loads into an empty database: a fresh install, or right
    # after the reset above. Loading over existing data isn't safe: the loader
    # deletes and recreates each event's lodgings (which cascades to their
    # campers) and posts its reports and test registrations again.
    - name: Check whether the database already has events
      tags: [camphoric_install, camphoric_reset, camphoric_data_reset]
      become: yes
      become_user: "{{ camphoric_user }}"
      ansible.builtin.shell:
        # --no-imports: Django 6's shell otherwise prints what it auto-imported first.
        cmd: >-
          pipenv run python manage.py shell --no-imports -c
          "from camphoric.models import Event; print(Event.objects.exists())"
        chdir: "{{camphoric_folder}}/server"
      register: camphoric_has_events
      changed_when: false

    - name: Load sample data
      tags: [camphoric_install, camphoric_reset, camphoric_data_reset]
      when: (camphoric_has_events.stdout_lines | last | default('')) == 'False'
      become: yes
      become_user: "{{ camphoric_user }}"
      ansible.builtin.shell:
        cmd: npm run import
        chdir: "{{camphoric_folder}}/data"
