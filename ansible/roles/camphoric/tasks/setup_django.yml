- name: Setup Django
  become: true
  become_user: "{{ camphoric_user }}"
  block:
    # Every task that changes what Django runs (its code, dependencies,
    # settings or static files) restarts it, once its service is set up
    # (handlers/main.yml, flushed in setup_django_service.yml), or at the
    # end of a failed run (site.yml's force_handlers).
    - name: Install virtual environment
      ansible.builtin.shell:
        chdir: "{{ camphoric_folder }}/server"
        cmd: "pipenv install {{ '--dev' if camphoric_environment == 'development' else '--deploy' }}"
      notify: Restart camphoric

    - name: Create Django.env
      template:
        owner: "{{ camphoric_user }}"
        group: "{{ camphoric_user }}"
        src: "templates/django.env.j2"
        dest: "{{ camphoric_folder }}/server/.env"
        mode: 0700
      notify: Restart camphoric

    - name: Create settings.py
      template:
        owner: "{{ camphoric_user }}"
        group: "{{ camphoric_user }}"
        src: "templates/settings.py.j2"
        dest: "{{ camphoric_folder }}/server/camphoric_server/settings_override.py"
        mode: 0664
      notify: Restart camphoric

    # The frontend (client/) is built from the checkout on the machine, so it
    # always matches the server code beside it.
    - name: Install the frontend's npm modules
      ansible.builtin.shell:
        chdir: "{{camphoric_folder}}/client"
        cmd: "npm ci"

    - name: Build the frontend
      ansible.builtin.shell:
        chdir: "{{camphoric_folder}}/client"
        cmd: "npm run build"

    # Emptied first: it may hold an older build (or the old js-build-main clone).
    - name: Remove the previous frontend build
      ansible.builtin.file:
        path: "{{camphoric_folder}}/server/frontend_bootstrap/build/"
        state: absent

    - name: Install the frontend build where Django serves it
      ansible.builtin.copy:
        src: "{{camphoric_folder}}/client/build/"
        dest: "{{camphoric_folder}}/server/frontend_bootstrap/build/"
        remote_src: yes
      notify: Restart camphoric

    # With DEBUG off (any environment but development), Django serves static
    # files only from STATIC_ROOT, through WhiteNoise; this copies the
    # frontend's bundles there from the build installed above.
    - name: Collect Django's static files
      ansible.builtin.shell:
        chdir: "{{camphoric_folder}}/server"
        cmd: "pipenv run python manage.py collectstatic --noinput"
      notify: Restart camphoric

    - name: Run Django migrations
      ansible.builtin.shell:
        chdir: "{{camphoric_folder}}/server"
        cmd: "pipenv run python manage.py migrate"

    - ignore_errors: yes
      block:
        - name: Create Django superuser
          ansible.builtin.shell:
            chdir: "{{camphoric_folder}}/server"
            cmd: "pipenv run python manage.py createsuperuser --noinput"

