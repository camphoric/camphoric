---
camphoric_uid: 1040
camphoric_user: camphoric
camphoric_environment: development
camphoric_release: HEAD
camphoric_force_update: false
camphoric_domain_name: localhost
camphoric_url: http://{{ camphoric_domain_name }}
# The site's address as browsers reach it, for links in email (CAMPHORIC_PUBLIC_URL):
# Django's port, forwarded to the host, on the Vagrant VM; the nginx site elsewhere.
camphoric_public_url: "{{ 'http://localhost:8000' if is_vagrant | default(false) | bool else ('https://' if nginx_ssl_on | bool else 'http://') ~ camphoric_domain_name }}"
camphoric_folder: "/home/{{camphoric_user}}/camphoric"

camphoric_hosted_location: "/"
camphoric_postgresql_user: camphoric
camphoric_postgresql_password: this-should-be-in-a-vault
camphoric_postgresql_db: camphoric

camphoric_email_backend: django.core.mail.backends.smtp.EmailBackend
camphoric_email_host: smtp.example.com
camphoric_email_port: 587
camphoric_email_name: tester
camphoric_email_host_user: registration@example.com
camphoric_email_host_password: abc123
camphoric_email_use_tls: on
camphoric_email_timeout: 30
# Send every message through this backend instead of its account's server. A
# development machine defaults to the console backend (messages go to the worker's
# log), so it never emails anyone; set '' in host_vars to send for real.
camphoric_email_force_backend: "{{ 'django.core.mail.backends.console.EmailBackend' if camphoric_environment == 'development' else '' }}"
# comma-separated addresses emailed about server errors
camphoric_admins: ''

camphoric_django_superuser_username: admin
camphoric_django_superuser_email: registration@example.com
camphoric_django_superuser_password: admin
camphoric_django_secret_key: this-should-be-in-vault
camphoric_django_dbbackup_storage: ''
camphoric_django_dbbackup_storage_options: '{}'

camphoric_paypal_base_url: https://api-m.sandbox.paypal.com
camphoric_paypal_client_id: this-should-be-in-vault
camphoric_paypal_secret: this-should-be-in-vault

# apt's pipenv (Ubuntu 24.04 refuses system-wide pip installs, PEP 668)
pipenv_bin: /usr/bin/pipenv

# For playbooks outside ansible/, which don't load ansible/group_vars: site.yml's value
# comes from group_vars/all.yml, where nodesource.node sees it too.
nodejs_version: 26.x
nginx_ssl_on: True

