volumes:
    db:

# A GitHub Packages token for the data image's npm ci, which installs events
# from the registry (see README.md):
#   CAMPHORIC_NPM_AUTH_TOKEN=$(gh auth token) docker compose build data
secrets:
  npm_token:
    environment: CAMPHORIC_NPM_AUTH_TOKEN

# Every port is published on the host's loopback (127.0.0.1) only, so nothing
# else on the network can reach the stack: Postgres has a known password and
# Django an admin/admin login. To reach it from another device, see
# "Reaching the stack from another device" in doc/development.md.
services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./env/local/shared.env
      - ./env/local/postgres.env
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db:/var/lib/postgresql/data/pgdata
      - ./postgres-initdb.sql:/docker-entrypoint-initdb.d/max_conns.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\"" ]
      interval: 10s
      timeout: 5s
      retries: 3

  django:
    env_file:
      - ./env/local/shared.env
      - ./env/local/django.env
    build: server/
    volumes:
      - ./server:/app
    # On a fresh database, also creates the admin the data service imports as
    # (DJANGO_SUPERUSER_* in env/local/shared.env); once it exists,
    # createsuperuser refuses and that's ignored.
    command: >
      bash -c "./manage.py migrate &&
               ./manage.py collectstatic --no-input &&
               { ./manage.py createsuperuser --no-input > /dev/null 2>&1 || true; } &&
               uvicorn camphoric_server.asgi:application --reload --timeout-graceful-shutdown 2 --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
#   healthcheck:
#     test: [ "CMD-SHELL", "wget -qO- http://localhost:8000/api/user || exit 1" ]
#     interval: 30s
#     timeout: 5s
#     retries: 3

  # Delivers queued email; restarts itself when the code changes.
  worker:
    env_file:
      - ./env/local/shared.env
      - ./env/local/django.env
    build: server/
    volumes:
      - ./server:/app
    command: ./manage.py camphoric_worker --queue-name '*' --reload
    # Retries while the django service is still migrating.
    restart: unless-stopped
    depends_on:
      django:
        condition: service_started

  # The frontend (client/): Vite's dev server on :3000, proxying /api to django.
  react:
    env_file:
      - ./env/local/shared.env
      - ./env/local/react.env
    environment:
      VITE_API_PROXY: 'http://django:8000/'
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    command: sh -c "npm ci && npm run dev"
#   depends_on:
#     django:
#       condition: service_healthy
#   healthcheck:
#     test: [ "CMD-SHELL", "wget -qO- --header 'Accept: */*' http://localhost:3000 || exit 1" ]
#     interval: 30s
#     timeout: 5s
#     retries: 3

  data:
    env_file:
      - ./env/local/shared.env
      - ./env/local/react.env
    build:
      context: data
      shm_size: '2gb'
      secrets:
        - npm_token
    volumes:
      - ./data:/app
      - ./data/import:/usr/local/bin/import
      - /app/node_modules
    # On `docker compose up`, import every event into a fresh database (once
    # the server answers: the import script waits), and exit; a database
    # that has events is left alone (--if-empty), like the Vagrant VM's.
    # `docker compose run --rm data import` imports regardless, and
    # reset-data-and-test flushes and re-imports.
    command: import --if-empty
    depends_on:
      - django
