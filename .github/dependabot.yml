# Dependabot version updates: one grouped PR a month per directory for minor
# and patch releases; major releases come as their own PRs. Security updates
# (a repository setting) still open as soon as an alert does.
#
# Commit messages follow RELEASE.md: runtime dependencies as `fix(deps)` (a
# patch release), development-only ones as `chore(deps-dev)` (no release).

version: 2

updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # @eslint/js needs the ESLint of the same major, so their majors come as
      # one PR; alone, either fails npm ci on a peer conflict.
      eslint-major:
        patterns: [eslint, '@eslint/js']
        update-types: [major]
    # These majors move several packages at once, which a one-package PR can't
    # do (it fails npm ci on a peer conflict). Each goes when its issue lands.
    ignore:
      # Mantine 9 (#870): every @mantine/* package pins the others' version.
      - dependency-name: '@mantine/*'
        update-types: ['version-update:semver-major']
      # @types/node follows the runtime's major (Node 26), which moves
      # with the Node pins listed at the base images below, not on its own.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  - package-ecosystem: npm
    directory: /data
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # @eslint/js needs the ESLint of the same major, so their majors come as
      # one PR; alone, either fails npm ci on a peer conflict.
      eslint-major:
        patterns: [eslint, '@eslint/js']
        update-types: [major]
    ignore:
      # @types/node follows the runtime's major (Node 26), which moves
      # with the Node pins listed at the base images below, not on its own.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # Pipfile / Pipfile.lock
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  # Base images. Python 3.12, Node 26 and Postgres 16 are pinned together
  # across the Pipfile, CI and the Dockerfiles (the root Dockerfile's
  # NODE_VERSION/PYTHON_VERSION ARGs, which Dependabot can't update), so an
  # image PR is a reminder to move them all, not a change to merge alone.
  # Node also sits in docker-compose.yml, ansible/group_vars/all.yml's
  # nodejs_version (and nodejs_supported_versions), the CI workflows'
  # node-version, README.md, doc/development.md and every package.json's
  # @types/node. Its majors are ignored here and in docker-compose below, so
  # Node gets no image PR: a new major is a deliberate change of every pin at
  # once (as #871 was), not a reminder from here.
  - package-ecosystem: docker
    directories: [/server, /data]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A new Postgres major needs the data upgraded (dump and restore or
      # pg_upgrade), not a tag bump.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      # Node's majors move with every other Node pin (see the base images
      # above).
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: fix
      include: scope
