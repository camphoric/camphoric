# Build the application image (never pushed) on every push/PR that touches its
# inputs (server/, client_v2/, data/, the Docker files) and prove it works:
# the release image + Postgres come up via docker-compose.image.yml, the SPA, a
# static asset (the DEBUG=off code path) and the API are smoke-tested, and then
# every event the importer loads (data/events and those from GitHub Packages) is
# imported into it (the live import test). Alongside, Sample Camp's
# registration-form e2e tests run against a throwaway server from the same
# image, through the import-tools page object every event repository's tests
# use.
# Publishing to ghcr.io happens separately in release-image.yml. See CONTAINER.md.
name: Docker image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client_v2/**'
      - 'data/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose.image.yml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'client_v2/**'
      - 'data/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose.image.yml'
      - '.github/workflows/docker.yml'

# One run per branch/PR: a newer push cancels the PR run it supersedes. Runs on
# main are left to finish so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # the live import's npm ci installs any @camphoric package not in a workspace
  # from GitHub Packages
  packages: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: camphoric:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image with Postgres
        run: docker compose -f docker-compose.image.yml up --wait --no-build

      - name: Smoke test (SPA, static asset with DEBUG=off, API)
        run: |
          set -eux
          html=$(curl -fsS http://localhost:8000/)
          echo "$html" | grep -q 'id="root"'
          asset=$(echo "$html" | grep -o '/static/[^"]*\.js' | head -1)
          test -n "$asset"
          curl -fsSI "http://localhost:8000$asset" | grep -qi 'content-type: .*javascript'
          curl -fsS http://localhost:8000/api/set-csrf-cookie > /dev/null

      # The release image is a blank slate, whatever the development
      # environments import: it boots with no events, and holds no event
      # importer (data/ never goes into it).
      - name: The release image starts with no events and no importer
        run: |
          set -eux
          app() { docker compose -f docker-compose.image.yml exec -T app "$@"; }
          events=$(app python manage.py shell --no-imports -c \
            "from camphoric.models import Event; print(Event.objects.count())" | tail -n 1)
          test "$events" = 0
          app sh -c '! test -e /app/data && ! command -v node && ! command -v tsx'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@camphoric'
          cache: npm
          cache-dependency-path: data/package-lock.json

      - name: Install the importer
        working-directory: data
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # The importer is a REST client, so it runs on the runner against the
      # published port. A non-zero exit (any event failing to import, including a
      # rejected sample registration) fails the job.
      - name: Live import of every event
        working-directory: data
        env:
          CAMPHORIC_URL: http://localhost:8000
          DJANGO_SUPERUSER_USERNAME: admin
          DJANGO_SUPERUSER_PASSWORD: admin
        run: npm run import

      # Queue one message and require the worker service to deliver it (to its
      # log: the compose file forces the console backend). No message from the
      # import may have failed either.
      - name: The worker delivers queued email
        run: |
          shell() {
            docker compose -f docker-compose.image.yml exec -T app \
              python manage.py shell --no-imports -c "$1"
          }
          id=$(shell "from camphoric import models; from camphoric.mail import outbox; \
            print(outbox.enqueue(event=models.Event.objects.first(), kind='test', \
              to='ci@example.com', from_email='ci@example.com', \
              subject='CI worker check', text='Delivered by the worker.').id)")
          for i in $(seq 1 30); do
            status=$(shell "from camphoric.models import EmailMessage; \
              print(EmailMessage.objects.get(id=$id).status)")
            [ "$status" = sent ] && break
            echo "message $id: $status"; sleep 2
          done
          failed=$(shell "from camphoric.models import EmailMessage; \
            print(EmailMessage.objects.filter(status='failed').count())")
          echo "message $id: $status; failed messages: $failed"
          test "$status" = sent && test "$failed" = 0
          # (Not piped into grep -q: its early exit fails the pipe under pipefail.)
          docker compose -f docker-compose.image.yml logs worker > worker.log
          grep 'Subject: CI worker check' worker.log

      # Every imported template must parse (legacy reports) or render
      # (server-variable reports) against the imported data.
      - name: Check the imported templates
        run: docker compose -f docker-compose.image.yml exec -T app python manage.py check_templates --all

      - name: App logs on failure
        if: failure()
        run: docker compose -f docker-compose.image.yml logs app worker

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.image.yml down -v

  # Sample Camp's e2e tests (data/events/sample-camp/e2e) drive the client's
  # registration form through the import-tools page object
  # (data/packages/import-tools/e2eRegistrationForm.ts), so a client change
  # that breaks the page object fails here, not only in the event repositories
  # that use its published release. camphoricServer() starts its own
  # throwaway Camphoric from this image, on a free port.
  registration-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The same build as build-and-smoke's, side by side with it: from the
      # shared cache when nothing it builds from has changed, else in full
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: camphoric:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@camphoric'
          cache: npm
          cache-dependency-path: data/package-lock.json

      - name: Install the importer
        working-directory: data
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # Chromium for the config's Desktop and Mobile Chrome projects
      - name: Install Playwright browsers
        working-directory: data
        run: npx playwright install --with-deps chromium

      - name: Sample Camp's registration-form e2e tests
        working-directory: data
        env:
          CAMPHORIC_E2E_IMAGE: camphoric:local
        run: npm run e2e -w @camphoric/camphoric-event-sample-camp

      # Traces are recorded on the first retry of a failing test.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sample-camp-e2e-results
          path: |
            data/events/sample-camp/test-results/
            data/events/sample-camp/playwright-report/
          retention-days: 7
