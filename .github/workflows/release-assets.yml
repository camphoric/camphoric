# Reusable workflow: build the frontend (client_v2/) at a given tag and attach it
# to that tag's GitHub Release as `frontend-build-v2.tar.gz`.
#
# Called directly (via `uses:`) by release-please.yml (stable releases) and
# prerelease.yml (feature-branch pre-releases) rather than triggered by
# `release: published` — because releases created with the default GITHUB_TOKEN
# do not emit events that start other workflows, so a `release`-triggered job
# would never run for our automated releases.
name: Release assets

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and attach the frontend asset to.
        required: true
        type: string
  # Also runnable on demand to (re)attach the asset to an existing release,
  # e.g. `gh workflow run release-assets.yml -f tag=v0.2.0`.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to build and attach the frontend asset to.
        required: true
        type: string

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: client_v2/package-lock.json

      - name: Build the frontend (client_v2/)
        working-directory: client_v2
        run: |
          npm ci
          npm run build

      - name: Package the frontend build
        # Contents of client_v2/build (Vite outDir) at the archive root.
        run: tar -czf frontend-build-v2.tar.gz -C client_v2/build .

      - name: Attach the frontend asset to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" frontend-build-v2.tar.gz --clobber
