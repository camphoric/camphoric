# Reusable workflow: build the frontends at a given tag and attach them to that
# tag's GitHub Release — `frontend-build.tar.gz` (client/, the v1 app) and
# `frontend-build-v2.tar.gz` (client_v2/, the v2 rebuild, when present).
#
# Called directly (via `uses:`) by release-please.yml (stable releases) and
# prerelease.yml (feature-branch pre-releases) rather than triggered by
# `release: published` — because releases created with the default GITHUB_TOKEN
# do not emit events that start other workflows, so a `release`-triggered job
# would never run for our automated releases.
name: Release assets

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and attach the frontend asset to.
        required: true
        type: string
  # Also runnable on demand to (re)attach the asset to an existing release,
  # e.g. `gh workflow run release-assets.yml -f tag=v0.2.0`.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to build and attach the frontend asset to.
        required: true
        type: string

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm
          # Glob so older tags without client_v2/ (or its lockfile) still resolve.
          cache-dependency-path: '**/package-lock.json'

      - name: Build the v1 frontend (client/)
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Package the v1 frontend build
        # Contents of client/build (Vite outDir) at the archive root.
        run: tar -czf frontend-build.tar.gz -C client/build .

      # client_v2/ only exists on tags cut after the v2 rebuild landed on main;
      # skip it (rather than fail) when building an older tag on demand.
      - name: Build the v2 frontend (client_v2/)
        if: hashFiles('client_v2/package.json') != ''
        working-directory: client_v2
        run: |
          npm ci
          npm run build

      - name: Package the v2 frontend build
        if: hashFiles('client_v2/package.json') != ''
        run: tar -czf frontend-build-v2.tar.gz -C client_v2/build .

      - name: Attach the frontend assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(frontend-build.tar.gz)
          if [ -f frontend-build-v2.tar.gz ]; then
            assets+=(frontend-build-v2.tar.gz)
          fi
          gh release upload "${{ inputs.tag }}" "${assets[@]}" --clobber
