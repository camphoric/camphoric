# Reusable workflow: build the frontend (client/) at a given tag and attach it
# to that tag's GitHub Release as `frontend-build-v2.tar.gz`.
#
# Called directly (via `uses:`) by release-please.yml (stable releases) and
# prerelease.yml (feature-branch pre-releases) rather than triggered by
# `release: published` — because releases created with the default GITHUB_TOKEN
# do not emit events that start other workflows, so a `release`-triggered job
# would never run for our automated releases.
name: Release assets

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and attach the frontend asset to.
        required: true
        type: string
  # Also runnable on demand to (re)attach the asset to an existing release,
  # e.g. `gh workflow run release-assets.yml -f tag=v0.2.0`.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to build and attach the frontend asset to.
        required: true
        type: string

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Tags cut before the v1 client was retired (DR-115) hold the v2 client in
      # client_v2/ and v1 in client/. Never build v1 under the v2 asset's name:
      # --clobber below would replace the release's real v2 build.
      - name: Find the v2 client at the tag
        id: client
        run: |
          if [ -f client_v2/package.json ]; then
            dir=client_v2
          elif [ -f client/src/api-types.ts ]; then
            dir=client
          else
            echo "::error::${{ inputs.tag }} has no v2 client (only the v1 app), so there is no frontend-build-v2.tar.gz to build."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: ${{ steps.client.outputs.dir }}/package-lock.json

      - name: Build the frontend
        working-directory: ${{ steps.client.outputs.dir }}
        run: |
          npm ci
          npm run build

      - name: Package the frontend build
        # Contents of the build (Vite outDir) at the archive root.
        run: tar -czf frontend-build-v2.tar.gz -C "${{ steps.client.outputs.dir }}/build" .

      - name: Attach the frontend asset to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" frontend-build-v2.tar.gz --clobber
