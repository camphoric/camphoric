# Fast, server-free validation of the event data under data/ on every push/PR
# that touches it. data/ is an npm workspace root (the importer) with the
# camphoric-event-* packages under packages/ and events/; its scripts run
# every workspace's too:
# the TypeScript must type-check (tsc --noEmit), every event module must load,
# satisfy the event import schema (camphoric-event-import-spec), carry
# well-formed JSON Schemas and pass the server's form and pricing checks
# (server/camphoric/schema_checks.py, run with the runner's python3)
# (data/__tests__/offline), and each workspace must import only its own files
# and the packages it declares. The live import against the built image runs
# in docker.yml.
name: Data import validation

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'server/camphoric/schema_checks.py'
      - '.github/workflows/data.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'server/camphoric/schema_checks.py'
      - '.github/workflows/data.yml'

# One run per branch/PR: a newer push cancels the PR run it supersedes. Runs on
# main are left to finish so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data/package-lock.json

      - run: npm ci

      # Every workspace's packages are hoisted into data/node_modules, which the
      # data image installs for its own platform: a workspace with a
      # node_modules of its own has drifted from the others' versions.
      - name: The workspaces share one node_modules
        run: test -z "$(find packages events -mindepth 2 -maxdepth 2 -name node_modules)"

      - name: Type-check
        run: npm run typecheck

      - name: Offline import validation
        run: npm test

      # Advisory until the pre-existing lint issues in data/ are cleaned up; flip
      # to blocking (remove continue-on-error) after an `eslint --fix` pass. (The
      # type-check it starts with already ran, blocking, above.)
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
