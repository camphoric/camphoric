# Fast, server-free validation of the event data under data/ on every push/PR
# that touches it:
# every event module must load, satisfy eventImportObjectSchema, carry
# well-formed JSON Schemas and pass the server's form and pricing checks
# (server/camphoric/schema_checks.py, run with the runner's python3)
# (data/__tests__/offline). The live import against the built image runs in
# docker.yml.
name: Data import validation

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'server/camphoric/schema_checks.py'
      - '.github/workflows/data.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'server/camphoric/schema_checks.py'
      - '.github/workflows/data.yml'

# One run per branch/PR: a newer push cancels the PR run it supersedes. Runs on
# main are left to finish so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data/package-lock.json

      - run: npm ci

      - name: Offline import validation
        run: npm test

      # Advisory until the pre-existing lint issues in data/ are cleaned up; flip
      # to blocking (remove continue-on-error) after an `eslint --fix` pass.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
