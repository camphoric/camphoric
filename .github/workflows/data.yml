# Fast, server-free validation of the event data under data/ on every push/PR
# that touches it. data/ is an npm workspace root (the importer) with the
# @camphoric/camphoric-event-* packages under packages/ and Sample Camp under
# events/, and it installs the camps' events, published from repositories of
# their own, from GitHub Packages; its scripts run every workspace's too:
# the TypeScript must type-check (tsc --noEmit), every event module must load,
# satisfy the event import schema (@camphoric/camphoric-event-import-spec), carry
# well-formed JSON Schemas and pass the server's form and pricing checks
# (server/camphoric/schema_checks.py, run with the runner's python3)
# (data/__tests__/offline), and each workspace must import only its own files
# and the packages it declares. All of that runs from the packages' TypeScript
# source; then the published packages are built, packed and used with plain
# Node (scripts/smoke-test-packages.sh). The live import against the built
# image runs in docker.yml.
name: Data import validation

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'server/camphoric/schema_checks.py'
      - '.github/workflows/data.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'server/camphoric/schema_checks.py'
      - '.github/workflows/data.yml'

# One run per branch/PR: a newer push cancels the PR run it supersedes. Runs on
# main are left to finish so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # npm ci installs any @camphoric package not in a workspace from GitHub Packages
  packages: read

jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@camphoric'
          cache: npm
          cache-dependency-path: data/package-lock.json

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every workspace's packages are hoisted into data/node_modules, which the
      # data image installs for its own platform: a workspace with a
      # node_modules of its own has drifted from the others' versions.
      - name: The workspaces share one node_modules
        run: test -z "$(find packages events -mindepth 2 -maxdepth 2 -name node_modules)"

      # Events installed from GitHub Packages take the spec as a peer, so they
      # share the importer's copy; one nested under an event was written for a
      # spec major the importer doesn't follow.
      - name: One copy of the spec is installed
        run: test -z "$(find node_modules -path 'node_modules/*/node_modules/@camphoric/camphoric-event-import-spec')"

      - name: Type-check
        run: npm run typecheck

      - name: Offline import validation
        run: npm test

      # The steps above ran from the packages' TypeScript source; this builds
      # and packs the published ones and uses them with plain Node.
      - name: The packed event-import packages work under plain Node
        run: scripts/smoke-test-packages.sh

      # Each event here (Sample Camp) packs and loads from its build, as a camp's
      # repository publishes its event.
      - name: Each packed event works under plain Node
        run: for event in events/*/; do scripts/smoke-test-event-package.sh "$event"; done

      # ESLint alone: `npm run lint`'s type-check already ran above.
      - name: Lint
        run: npx eslint . --max-warnings 0
