# Check the client (client/) on every push/PR that touches it: types,
# lint and the vitest unit suite, plus the Playwright end-to-end suite on
# desktop and mobile browsers. (The production build itself runs inside the
# image build in docker.yml.) A change to the server's pricing or the shared
# pricing parity fixtures runs it too, since the client checks those fixtures
# (SPEC DR-14).
name: Client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/camphoric/pricing.py'
      - 'server/tests/data/pricing_parity.json'
      - '.github/workflows/client.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/camphoric/pricing.py'
      - 'server/tests/data/pricing_parity.json'
      - '.github/workflows/client.yml'

# One run per branch/PR: a newer push cancels the PR run it supersedes. Runs on
# main are left to finish so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # The component tests drive a static Storybook build of the stories; the
  # registration smoke test needs the Django API, so it's left out here (no
  # backend; playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # The browsers are cached by Playwright's version and the runner's OS release
      # (they're built for it); their system packages aren't, so a cached run still
      # installs those.
      - name: Playwright version and runner OS
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright.outputs.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium-webkit

      # Chromium for Desktop/Mobile Chrome, WebKit for Mobile Safari.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install the browsers' system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # The tests serve this build (playwright.config.ts).
      - name: Build Storybook
        run: npm run storybook:build

      - name: End-to-end tests
        run: npx playwright test

      # Traces are recorded on the first retry of a failing test.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: client/test-results/
          retention-days: 7
