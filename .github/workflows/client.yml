# Check the client (client/) on every push/PR that touches it: types,
# lint and the vitest unit suite, plus the Playwright end-to-end suite on
# desktop and mobile browsers. (The production build itself runs inside the
# image build in docker.yml.) A change to the server's pricing or the shared
# pricing parity fixtures runs it too, since the client checks those fixtures
# (SPEC DR-14).
name: Client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/camphoric/pricing.py'
      - 'server/tests/data/pricing_parity.json'
      - '.github/workflows/client.yml'
      - '.github/actions/playwright-browsers/**'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/camphoric/pricing.py'
      - 'server/tests/data/pricing_parity.json'
      - '.github/workflows/client.yml'
      - '.github/actions/playwright-browsers/**'

# One run per branch/PR: a newer push cancels the PR run it supersedes. Runs on
# main are left to finish so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # The component tests drive a static Storybook build of the stories; the
  # registration smoke test needs the Django API, so it's left out here (no
  # backend; playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    # A run takes 2-3 minutes: fail a stalled one instead of waiting out the
    # 6-hour default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Chromium for Desktop/Mobile Chrome, WebKit for Mobile Safari, from
      # Playwright's image, with nothing installed on the runner.
      - uses: ./.github/actions/playwright-browsers
        with:
          working-directory: client

      # The tests serve this build (playwright.config.ts).
      - name: Build Storybook
        run: npm run storybook:build

      - name: End-to-end tests
        run: npx playwright test

      # Traces are recorded on the first retry of a failing test.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: client/test-results/
          retention-days: 7
