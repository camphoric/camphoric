# Reusable workflow: build the application image at a release tag and push it to
# GitHub Container Registry as ghcr.io/camphoric/camphoric:<tag> (plus :latest for
# stable tags). See CONTAINER.md and RELEASE.md.
#
# Called directly (via `uses:`) by release-please.yml (stable releases) and
# prerelease.yml (feature-branch pre-releases) rather than triggered by
# `release: published` — releases created with the default GITHUB_TOKEN do not
# emit events that start other workflows.
name: Release image

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and push.
        required: true
        type: string
  # Also runnable on demand to (re)publish the image for an existing release,
  # e.g. `gh workflow run release-image.yml -f tag=v0.2.0`.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to build and push.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository is lowercased by the action -> ghcr.io/camphoric/camphoric
          images: ghcr.io/${{ github.repository }}
          # `latest` only for stable releases; pre-release tags always contain a '-'.
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag, '-') }}
          labels: |
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.description=Camphoric server with the v2 frontend

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Avoid the extra untagged attestation manifests in the ghcr package UI.
          provenance: false
