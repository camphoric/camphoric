name: Build React Frontend

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/react.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/react.yml'

# One run per branch/PR: a newer push cancels the PR run it supersedes. Runs on
# main are left to finish so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - id: cache-npm 
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci

      - name: Check typing
        run: npx tsc

      - name: Run unit tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Deploy JS to js-build-main
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: js-build-main
          force_orphan: true
          publish_dir: ./client/build
