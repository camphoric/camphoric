name: Django Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/django.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/django.yml'

# One run per branch/PR: a newer push cancels the PR run it supersedes. Runs on
# main are left to finish so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SECRET_KEY: not-a-real-secret-key-really-not-a-real-secret-key
  DATABASE_URL: postgres://postgres:postgres@localhost/postgres
  PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
  PAYPAL_CLIENT_ID: your-paypal-client-id-here
  PAYPAL_SECRET: your-paypal-api-secret-here
  DEBUG: on

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.11', '3.12']

    services:
      db_service:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: python -m pip install --upgrade pipenv wheel psycopg2-binary
      - name: Make build dir
        run: mkdir -p frontend_bootstrap/build/
      - id: cache-pipenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipfile-${{ hashFiles('**/Pipfile.lock') }}-${{ hashFiles('**/Pipfile') }}-3
      - name: Install dependencies
        if: steps.cache-pipenv.outputs.cache-hit != 'true'
        run: pipenv install --dev
      - name: Run flake8
        run: pipenv run flake8
      - name: Run Tests
        run: pipenv run python manage.py test
