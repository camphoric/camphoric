name: Django Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      # the legacy report tests render the events' report templates: those
      # under data/events/ and those of the events data/ installs (the lockfile
      # pins their versions)
      - 'data/events/*/reports/**'
      - 'data/package-lock.json'
      - '.github/workflows/django.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'data/events/*/reports/**'
      - 'data/package-lock.json'
      - '.github/workflows/django.yml'

# One run per branch/PR: a newer push cancels the PR run it supersedes. Runs on
# main are left to finish so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # npm ci installs the events published from their own repositories from
  # GitHub Packages
  packages: read

env:
  SECRET_KEY: not-a-real-secret-key-really-not-a-real-secret-key
  DATABASE_URL: postgres://postgres:postgres@localhost/postgres
  PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
  PAYPAL_CLIENT_ID: your-paypal-client-id-here
  PAYPAL_SECRET: your-paypal-api-secret-here
  DEBUG: on

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    strategy:
      max-parallel: 4
      matrix:
        # Matches the Pipfile's python_version; pipenv won't build with another.
        python-version: ['3.12']

    services:
      db_service:
        # The PostgreSQL Camphoric assumes (Django 6.1 needs 15+), as in docker-compose.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      # The legacy report tests also render the reports of the events data/
      # installs from GitHub Packages (data/node_modules)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@camphoric'
          cache: npm
          cache-dependency-path: data/package-lock.json
      - name: Install data/ (the events' report templates)
        working-directory: ./data
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --ignore-scripts
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: python -m pip install --upgrade pipenv wheel
      - name: Make build dir
        # The static directories settings expect (the built client, collected
        # files), so the system checks and whitenoise don't warn about them.
        run: mkdir -p frontend_bootstrap/build/static static
      # Keyed on the exact Python (e.g. 3.12.15), not just 3.12: a virtualenv
      # built under one patch release is broken under the next, and the
      # runner image updates it without notice.
      - id: cache-pipenv
        uses: actions/cache@v6
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-pipfile-${{ hashFiles('**/Pipfile.lock') }}-${{ hashFiles('**/Pipfile') }}-3
      - name: Install dependencies
        if: steps.cache-pipenv.outputs.cache-hit != 'true'
        run: pipenv install --dev
      - name: Run flake8
        run: pipenv run flake8
      # Fails when a model change has no migration written for it.
      - name: Check for missing migrations
        run: pipenv run python manage.py makemigrations --check --dry-run
      - name: Run Tests
        # A worker per CPU, each on its own copy of the test database.
        run: pipenv run python manage.py test --parallel auto
