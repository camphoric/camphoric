<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Camphoric{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f8; --card: #fff; --text: #1f2328; --muted: #57606a; --accent: #1c7ed6; --border: #d0d7de; --error: #c92a2a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1b1e; --card: #25262b; --text: #e9ecef; --muted: #a6a7ab; --accent: #4dabf7; --border: #373a40; --error: #ff8787; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 32rem; margin: 10vh auto; padding: 0 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    h1 { font-size: 1.4rem; margin: 0 0 12px; overflow-wrap: anywhere; }
    p, li { color: var(--muted); }
    p { margin: 0 0 12px; }
    ul { margin: 0 0 12px; padding-left: 1.25rem; }
    strong { color: var(--text); }
    a { color: var(--accent); }
    label { display: block; margin: 0 0 4px; font-weight: 600; }
    input[type=text], input[type=password] { box-sizing: border-box; width: 100%; padding: 8px 10px; margin: 0 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    button { border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
    .error { color: var(--error); }
    .who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding: 12px 0; margin: 0 0 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .who form { margin: 0; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
